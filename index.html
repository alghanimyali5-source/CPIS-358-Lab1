<html>
<head>
    <title>My First HTML Example</title>
</head>

<body bgcolor="red">

    <h1>My First HTML Page</h1>

    <h2>HTML Basic Elements</h2>

    <p>
        This is a basic paragraph.
    </p>

    This is the first line.<br>
    This is the second line.

    <p>
        <b>This text is Bold.</b><br>
        <u>This text is Underlined.</u><br>
        <i>This text is Italic.</i>
    </p>

    <p>
        H<sub>2</sub>O
        <br>
        X<sup>2</sup>
    </p>

    <font color="blue" size="5" face="Arial">
        This text is formatted using FONT tag.
    </font>

</body>
</html>
